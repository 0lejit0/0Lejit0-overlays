<!doctype html><html><head><meta charset="utf-8"><title>Gameplay</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
  .edge-tl,.edge-tr,.edge-bl,.edge-br{position:absolute;width:48px;height:48px;pointer-events:none;opacity:.75}
  .edge-tl{top:14px;left:14px;border-top:3px solid var(--teal);border-left:3px solid var(--teal);border-top-left-radius:14px;filter:drop-shadow(0 0 8px rgba(46,230,214,.45))}
  .edge-tr{top:14px;right:14px;border-top:3px solid var(--purple);border-right:3px solid var(--purple);border-top-right-radius:14px;filter:drop-shadow(0 0 8px rgba(139,92,246,.45))}
  .edge-bl{bottom:14px;left:14px;border-bottom:3px solid var(--purple);border-left:3px solid var(--purple);border-bottom-left-radius:14px;filter:drop-shadow(0 0 8px rgba(139,92,246,.45))}
  .edge-br{bottom:14px;right:14px;border-bottom:3px solid var(--teal);border-right:3px solid var(--teal);border-bottom-right-radius:14px;filter:drop-shadow(0 0 8px rgba(46,230,214,.45))}
</style></head>
<body class="tw"><!-- Clean 1920x1080 transparent fullscreen gameplay frame: add widgets/*.html as separate OBS browser sources above this --><div class="edge-tl"></div><div class="edge-tr"></div><div class="edge-bl"></div><div class="edge-br"></div></body></html>
