<!doctype html><html><head><meta charset="utf-8"><title>Chat — GTA VI</title>
<link rel="stylesheet" href="../shared/theme.css"><script src="../shared/config.js"></script>
<style>
  html,body{width:100%;height:100%}
  #chat{position:absolute;inset:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 15%);
    mask-image:linear-gradient(to bottom,transparent 0%,#000 15%)}
  .msg{font-size:17px;line-height:1.34;padding:6px 11px;border-radius:10px;background:rgba(11,5,20,.42);
       border-left:3px solid var(--pink);animation:in .3s cubic-bezier(.2,.9,.3,1) both;word-wrap:break-word;
       box-shadow:0 2px 8px rgba(0,0,0,.22);text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .msg.action .txt{font-style:italic;opacity:.92}
  .msg .head{display:inline;margin-right:6px}
  .msg b{font-weight:700}
  .badges{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin-right:5px;transform:translateY(-1px)}
  .bdg{display:inline-flex;align-items:center;justify-content:center;padding:1px 5px;border-radius:4px;
       font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1.3}
  .bdg.broadcaster{background:#ff3d8b;color:#fff}
  .bdg.moderator{background:#2ee6d6;color:#052421}
  .bdg.vip{background:#ff8a4c;color:#230d00}
  .bdg.founder{background:#ffb84d;color:#271500}
  .bdg.subscriber{background:rgba(157,78,221,.5);color:#fff5fa;border:1px solid rgba(255,61,139,.6)}
  .emote{height:1.4em;width:auto;vertical-align:middle;margin:-3px 2px}
  .msg.gone{animation:out .45s ease-in forwards}
  @keyframes in{from{opacity:0;transform:translateX(18px)}}
  @keyframes out{to{opacity:0;transform:translateX(-18px)}}
</style></head><body>
<div id="chat"></div>
<script>
const q = new URLSearchParams(location.search);
const cfg = (window.OLEJIT && OLEJIT.chat) || {};
const channel = (q.get('channel') || OLEJIT.twitchChannel).toLowerCase();
const MAX = parseInt(q.get('max'), 10) || cfg.maxMessages || 10;
const LIFE = (q.has('life') ? parseFloat(q.get('life')) : (cfg.fadeSeconds ?? 60)) * 1000;
const SHOW_BADGES = cfg.showBadges !== false;
const SHOW_EMOTES = cfg.showEmotes !== false;
const HIDE_CMDS = cfg.hideCommands !== false;
const box = document.getElementById('chat');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BADGE_MAP = { broadcaster:['LIVE','broadcaster'], moderator:['MOD','moderator'], vip:['VIP','vip'], founder:['FND','founder'], subscriber:['SUB','subscriber'] };
function renderBadges(raw){
  if (!SHOW_BADGES || !raw) return '';
  const list = raw.split(',').map(b => b.split('/')[0]).filter(k => BADGE_MAP[k]);
  return list.length ? `<span class="badges">${list.slice(0,3).map(k => `<span class="bdg ${BADGE_MAP[k][1]}">${BADGE_MAP[k][0]}</span>`).join('')}</span>` : '';
}
function renderMessage(text, emotesTag){
  if (!SHOW_EMOTES || !emotesTag) return esc(text);
  const chars = [...text], reps = [];
  emotesTag.split('/').forEach(g => {
    const [id, ranges] = g.split(':'); if (!id || !ranges) return;
    ranges.split(',').forEach(r => { const [s, e] = r.split('-').map(Number); if (!Number.isNaN(s) && !Number.isNaN(e)) reps.push([s, e, id]); });
  });
  reps.sort((a, b) => a[0] - b[0]);
  let out = '', cur = 0;
  for (const [s, e, id] of reps) {
    if (s < cur) continue;
    out += esc(chars.slice(cur, s).join(''));
    out += `<img class="emote" alt="${esc(chars.slice(s, e + 1).join(''))}" src="https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(id)}/default/dark/2.0">`;
    cur = e + 1;
  }
  return out + esc(chars.slice(cur).join(''));
}
function add(name, color, text, opts = {}){
  const d = document.createElement('div'); d.className = 'msg' + (opts.action ? ' action' : '');
  const c = color || '#2ee6d6', body = renderMessage(text, opts.emotes);
  d.innerHTML = `<span class="head">${renderBadges(opts.badges)}<b style="color:${c}">${esc(name)}</b></span>${opts.action ? `<span class="txt" style="color:${c}">${body}</span>` : `<span class="txt">${body}</span>`}`;
  box.appendChild(d);
  while (box.children.length > MAX) box.removeChild(box.firstChild);
  if (!q.has('preview') && LIFE > 0) setTimeout(() => { d.classList.add('gone'); setTimeout(() => d.parentNode && box.removeChild(d), 450); }, LIFE);
}
if (q.has('preview')) {
  [
    ['viewer_one', '#2ee6d6', 'Vice City looks unreal', { badges: 'subscriber/6' }],
    ['NightShift', '#ff8a4c', 'that getaway was clean', { badges: 'moderator/1' }],
    ['0Lejit0',    '#ff3d8b', 'welcome to Leonida!', { badges: 'broadcaster/1' }]
  ].forEach(([n,c,t,o]) => add(n,c,t,o));
} else (function connect(){
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => { ws.send('CAP REQ :twitch.tv/tags'); ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + Math.floor(Math.random()*80000+1000)); ws.send('JOIN #' + channel); };
  ws.onmessage = e => e.data.split('\r\n').forEach(line => {
    if (line.startsWith('PING')) return ws.send('PONG :tmi.twitch.tv');
    const m = line.match(/^@(\S+) :(\w+)!\S+ PRIVMSG #\S+ :(.*)$/); if (!m) return;
    const tags = Object.fromEntries(m[1].split(';').map(t => t.split('=')));
    let text = m[3], action = false;
    if (text.startsWith('\u0001ACTION ') && text.endsWith('\u0001')) { text = text.slice(8, -1); action = true; }
    if (HIDE_CMDS && text.startsWith('!')) return;
    add(tags['display-name'] || m[2], tags.color, text, { badges: tags.badges, emotes: tags.emotes, action });
  });
  ws.onclose = () => setTimeout(connect, 3000);
})();
</script></body></html>
