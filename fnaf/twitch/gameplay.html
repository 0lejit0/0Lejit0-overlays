<!doctype html><html><head><meta charset="utf-8"><title>Gameplay — FNaF Fullscreen</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
  .edge-tl,.edge-tr,.edge-bl,.edge-br{position:absolute;width:48px;height:48px;pointer-events:none;opacity:.75}
  .edge-tl{top:14px;left:14px;border-top:3px solid var(--amber);border-left:3px solid var(--amber);border-top-left-radius:14px;filter:drop-shadow(0 0 8px rgba(245,158,11,.45))}
  .edge-tr{top:14px;right:14px;border-top:3px solid var(--red);border-right:3px solid var(--red);border-top-right-radius:14px;filter:drop-shadow(0 0 8px rgba(239,68,68,.45))}
  .edge-bl{bottom:14px;left:14px;border-bottom:3px solid var(--red);border-left:3px solid var(--red);border-bottom-left-radius:14px;filter:drop-shadow(0 0 8px rgba(239,68,68,.45))}
  .edge-br{bottom:14px;right:14px;border-bottom:3px solid var(--amber);border-right:3px solid var(--amber);border-bottom-right-radius:14px;filter:drop-shadow(0 0 8px rgba(245,158,11,.45))}
</style></head>
<body class="tw"><!-- Clean 1920x1080 transparent fullscreen gameplay frame --><div class="edge-tl"></div><div class="edge-tr"></div><div class="edge-bl"></div><div class="edge-br"></div></body></html>
