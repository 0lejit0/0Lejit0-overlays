<!doctype html><html><head><meta charset="utf-8"><title>Facecam Outline — FNaF</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  html,body{width:100vw;height:100vh;background:transparent;overflow:hidden}
  .wrap{position:absolute;inset:10px;border-radius:18px;border:3px solid transparent;
    background:linear-gradient(transparent,transparent) padding-box,linear-gradient(135deg,var(--amber),var(--red),var(--green)) border-box;
    box-shadow:0 0 24px rgba(245,158,11,.35),0 0 16px rgba(239,68,68,.2)}
  .wrap::before,.wrap::after{content:"";position:absolute;width:32px;height:32px;border:4px solid var(--amber);
    filter:drop-shadow(0 0 8px rgba(245,158,11,.55))}
  .wrap::before{top:-7px;left:-7px;border-right:0;border-bottom:0;border-top-left-radius:20px}
  .wrap::after{bottom:-7px;right:-7px;border-left:0;border-top:0;border-bottom-right-radius:20px;border-color:var(--red);
    filter:drop-shadow(0 0 8px rgba(239,68,68,.55))}
  .lbl{position:absolute;top:10px;right:14px;display:flex;align-items:center;gap:6px;
    font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--text);
    text-shadow:0 1px 4px rgba(0,0,0,.95);opacity:.88}
  .lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
  .nolabel .lbl{display:none}
</style></head>
<body>
<div class="wrap" id="w"><div class="lbl" id="lbl">CAM 01</div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has('nolabel')) document.getElementById('w').classList.add('nolabel');
  if (q.get('label')) document.getElementById('lbl').textContent = q.get('label');
</script>
</body></html>
